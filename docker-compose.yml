services:
  # The Flask Application
  web:
    build: .
    container_name: cognilit_web
    volumes:
      - .:/app
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://tushar:password@db:5432/cognilit_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5050/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cognilit_db
    environment:
      POSTGRES_USER: tushar
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cognilit_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis Cache & Limiter Storage
  redis:
    image: redis:7-alpine
    container_name: cognilit_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Cloudflare Tunnel Ingress
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cognilit_tunnel
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in the .env file}
    command: tunnel --no-autoupdate run --token $$TUNNEL_TOKEN
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
