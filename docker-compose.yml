version: '3.8'

services:
  # The Flask Application
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - DATABASE_URI=postgresql://tushar:password@db:5432/cognilit_ai
      - REDIS_URI=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tushar
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cognilit_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis Cache & Limiter Storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: